<text x="1140.0" y="395.0" font-size="26.1" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#14532D" text-anchor="middle" dominant-baseline="middle">Per-frame budget:  15.4 ms median  -  ~78 ms max     vs     200 ms SDD     =&gt;     13x under at the median, 2.5x worst-case margin</text>
